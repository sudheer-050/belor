name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (skip native downloads, the tests below need none)
        run: npm ci --ignore-scripts
      - name: Syntax check every script
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.js -Path src, tools, test | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $($_.FullName)" }
          }
      - name: Claude Code and Codex config editing tests
        run: node test/agent-setup.js
      - name: Native application resume launch checks
        run: node test/resume-tools.js
      - name: Automatic running-session selection checks
        run: node test/active-sessions.js
      - name: Window conversation matching checks
        run: node test/window-conversation.js
      - name: External terminal sidebar activation checks
        run: node test/terminal-window-sidebar.js
      - name: Close-to-tray and explicit quit checks
        run: node test/background.js
      - name: Saved terminal and conversation recovery checks
        run: node test/terminal-persistence.js
      - name: Upgrade startup defaults
        run: node test/startup-restore.js
      - name: Popout session ownership checks
        run: node test/popout-window.js
      - name: Native conversation notification checks
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/notify-session.ps1
      - name: Native process and saved-session ownership checks
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/active-sessions-native.ps1
